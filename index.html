<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal For My Akriti 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+Devanagari:wght@700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Cinzel', serif;
}

/* ROYAL BACKGROUND */
#page1 {
    height: 100vh;
    background: radial-gradient(circle at center, #ffcc66, #b8860b, #4b0000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

/* Mandala Animation */
.mandala {
    position: absolute;
    width: 350px;
    opacity: 0.15;
    animation: rotateMandala 25s linear infinite;
}

@keyframes rotateMandala {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Greeting */
.greeting {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 3.5rem;
    color: gold;
    text-shadow: 0 0 20px #fff, 0 0 40px #ffcc00;
    text-align: center;
    z-index: 2;
}

/* Decorative Border */
.border {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    bottom: 10px;
    border: 8px double gold;
    pointer-events: none;
}

/* Bangle Button */
.bangle-btn {
    width: 160px;
    margin-top: 50px;
    cursor: pointer;
    transition: 0.4s ease;
    z-index: 2;
}

.bangle-btn:hover {
    transform: scale(1.15) rotate(15deg);
}

/* PAGE 2 */
#page2 {
    display: none;
    height: 100vh;
    position: relative;
    overflow: hidden;
    background: black;
}

.door {
    width: 100%;
    height: 100vh;
    object-fit: cover;
    transition: transform 2s ease;
}

/* Playful Royal Key */
.key-btn {
    position: absolute;
    bottom: 60px;
    right: 40px;
    width: 120px;
    cursor: pointer;
    animation: float 2s infinite ease-in-out;
    filter: drop-shadow(0 0 15px gold);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

/* Falling petals */
.fall {
    position: absolute;
    font-size: 26px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}

video {
    display: none;
    width: 100%;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
    <div class="border"></div>
    <img src="https://i.imgur.com/YOUR_MANDALA_IMAGE.png" class="mandala">
    <div class="greeting">खम्मा घणी आकृति 👑</div>
    <img src="bangle.jpg" class="bangle-btn" onclick="goToPage2()">
</div>

<!-- PAGE 2 -->
<div id="page2">
    <img src="gate.jpg" class="door" id="door">
    <img src="key.jpg" class="key-btn" onclick="openDoor()">
    <video id="loveVideo" src="video.mov"></video>
</div>

<script>
function goToPage2() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
    createFall();
}

function openDoor() {
    document.getElementById("door").style.transform = "rotateY(90deg)";
    setTimeout(function() {
        document.getElementById("door").style.display = "none";
        let video = document.getElementById("loveVideo");
        video.style.display = "block";
        video.play();
    }, 2000);
}

function createFall() {
    for(let i=0; i<30; i++){
        let el = document.createElement("div");
        el.classList.add("fall");
        el.innerHTML = Math.random() > 0.5 ? "🌹" : "💛";
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (Math.random() * 4 + 3) + "s";
        document.getElementById("page2").appendChild(el);
    }
}
</script>

</body>
</html>
