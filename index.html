<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Maharani 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+Devanagari:wght@700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: 'Cinzel', serif;
}

/* PAGE 1 */
#page1 {
    height: 100vh;
    background: radial-gradient(circle at center, #ffcc66, #b8860b, #4b0000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
}

.greeting {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: 3.5rem;
    color: gold;
    text-shadow: 0 0 20px #fff, 0 0 40px #ffcc00;
    text-align: center;
    z-index: 2;
}

.bangle-btn {
    width: 160px;
    margin-top: 50px;
    cursor: pointer;
    transition: 0.4s ease;
    z-index: 2;
}

.bangle-btn:hover {
    transform: scale(1.15) rotate(15deg);
}

/* PAGE 2 */
#page2 {
    display: none;
    height: 100vh;
    background: black;
    position: relative;
    overflow: hidden;
}

/* DOUBLE DOORS */
.door-container {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
}

.door-left, .door-right {
    width: 50%;
    height: 100%;
    background-image: url('gate.jpg');
    background-size: cover;
    background-position: center;
    transition: transform 2s ease;
}

.door-left {
    transform-origin: left;
}

.door-right {
    transform-origin: right;
}

/* KEY */
.key-btn {
    position: absolute;
    bottom: 60px;
    right: 40px;
    width: 120px;
    cursor: pointer;
    animation: float 2s infinite ease-in-out;
    filter: drop-shadow(0 0 15px gold);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
    100% { transform: translateY(0px); }
}

/* Sparkles */
.sparkle {
    position: absolute;
    color: gold;
    font-size: 20px;
    animation: sparkleAnim 1s ease-out forwards;
}

@keyframes sparkleAnim {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(2) translateY(-50px); }
}

/* Falling petals */
.fall {
    position: absolute;
    font-size: 26px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}

video {
    display: none;
    width: 100%;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
    <div class="greeting">खम्मा घणी आकृति 👑</div>
    <img src="bangle.jpg" class="bangle-btn" onclick="goToPage2()">
</div>

<!-- PAGE 2 -->
<div id="page2">

    <div class="door-container">
        <div class="door-left" id="doorLeft"></div>
        <div class="door-right" id="doorRight"></div>
    </div>

    <img src="key.jpg" class="key-btn" id="key" onclick="openDoor()">
    <video id="loveVideo" src="video.mov"></video>

</div>

<script>

function goToPage2() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
    createFall();
}

function openDoor() {

    let key = document.getElementById("key");

    // Move key toward center
    key.style.transition = "1s";
    key.style.right = "45%";
    key.style.bottom = "45%";

    createSparkles();

    setTimeout(function() {
        document.getElementById("doorLeft").style.transform = "rotateY(-90deg)";
        document.getElementById("doorRight").style.transform = "rotateY(90deg)";
    }, 1000);

    setTimeout(function() {
        document.querySelector(".door-container").style.display = "none";
        key.style.display = "none";
        let video = document.getElementById("loveVideo");
        video.style.display = "block";
        video.play();
    }, 3000);
}

function createSparkles() {
    for(let i=0; i<20; i++){
        let sp = document.createElement("div");
        sp.classList.add("sparkle");
        sp.innerHTML = "✨";
        sp.style.left = "50%";
        sp.style.top = "50%";
        sp.style.position = "absolute";
        document.getElementById("page2").appendChild(sp);
        setTimeout(()=>sp.remove(),1000);
    }
}

function createFall() {
    for(let i=0; i<30; i++){
        let el = document.createElement("div");
        el.classList.add("fall");
        el.innerHTML = Math.random() > 0.5 ? "🌹" : "💛";
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (Math.random() * 4 + 3) + "s";
        document.getElementById("page2").appendChild(el);
    }
}

</script>

</body>
</html>
