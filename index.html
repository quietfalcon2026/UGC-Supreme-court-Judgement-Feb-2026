<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal For My Akriti 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+Devanagari:wght@700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow-x: hidden;
    font-family: 'Cinzel', serif;
}

/* ---------------- PAGE 1 ---------------- */

#page1 {
    height: 100vh;
    background: radial-gradient(circle at center, #ffcc66, #b8860b, #4b0000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
    text-align: center;
    padding: 20px;
}

.border {
    position: absolute;
    inset: 15px;
    border: 6px double gold;
    border-radius: 20px;
    pointer-events: none;
}

.mandala {
    position: absolute;
    width: 60vw;
    max-width: 350px;
    opacity: 0.12;
    animation: rotateMandala 30s linear infinite;
}

@keyframes rotateMandala {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.greeting {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: gold;
    text-shadow: 0 0 15px #fff, 0 0 35px #ffcc00;
    z-index: 2;
}

.bangle-btn {
    width: 40vw;
    max-width: 170px;
    margin-top: 40px;
    cursor: pointer;
    transition: 0.4s ease;
    z-index: 2;
}

.bangle-btn:hover {
    transform: scale(1.1) rotate(10deg);
}

/* ---------------- PAGE 2 ---------------- */

#page2 {
    display: none;
    height: 100vh;
    background: black;
    position: relative;
    overflow: hidden;
}

.door {
    width: 100%;
    height: 100vh;
    object-fit: cover;
    transition: transform 2s ease;
    transform-origin: left;
}

/* PLAYFUL KEY */
.key-btn {
    position: absolute;
    bottom: 40px;
    right: 20px;
    width: 25vw;
    max-width: 120px;
    cursor: pointer;
    animation: float 2s infinite ease-in-out, wiggle 1.5s infinite;
    filter: drop-shadow(0 0 10px gold);
    transition: all 1s ease;
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0px); }
}

@keyframes wiggle {
    0% { rotate: 0deg; }
    25% { rotate: 8deg; }
    50% { rotate: -8deg; }
    75% { rotate: 5deg; }
    100% { rotate: 0deg; }
}

/* Falling petals */
.fall {
    position: absolute;
    font-size: 22px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}

video {
    display: none;
    width: 100%;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
    <div class="border"></div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Mandala_pattern.svg/512px-Mandala_pattern.svg.png" class="mandala">
    <div class="greeting">खम्मा घणी आकृति 👑</div>
    <img src="bangle.jpg" class="bangle-btn" onclick="goToPage2()">
</div>

<!-- PAGE 2 -->
<div id="page2">
    <img src="gate.jpg" class="door" id="door">
    <img src="key.jpg" class="key-btn" id="key" onclick="openDoor()">

    <video id="loveVideo" playsinline controls>
        <source src="video.mp4" type="video/mp4">
    </video>
</div>

<script>

function goToPage2() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
    createFall();
}

function openDoor() {

    const door = document.getElementById("door");
    const video = document.getElementById("loveVideo");
    const key = document.getElementById("key");

    // Key flies toward center (lock area)
    key.style.bottom = "45%";
    key.style.right = "45%";
    key.style.transform = "scale(0.7) rotate(180deg)";

    setTimeout(() => {
        door.style.transform = "rotateY(90deg)";
    }, 800);

    // After door opens
    setTimeout(() => {
        key.style.display = "none";  // Hide key before video
        door.style.display = "none";
        video.style.display = "block";
        video.play().catch(err => console.log(err));
    }, 2800);
}

function createFall() {
    for(let i=0; i<30; i++){
        let el = document.createElement("div");
        el.classList.add("fall");
        el.innerHTML = Math.random() > 0.5 ? "🌹" : "💛";
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (Math.random() * 4 + 3) + "s";
        document.getElementById("page2").appendChild(el);
    }
}

</script>

</body>
</html>
