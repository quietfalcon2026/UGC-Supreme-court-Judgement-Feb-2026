<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Royal For My Akriti 👑</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Noto+Serif+Devanagari:wght@700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    overflow-x: hidden;
    font-family: 'Cinzel', serif;
}

/* ---------------- PAGE 1 ---------------- */

#page1 {
    height: 100vh;
    background: radial-gradient(circle at center, #ffcc66, #b8860b, #4b0000);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    position: relative;
    text-align: center;
    padding: 20px;
}

/* Decorative Border */
.border {
    position: absolute;
    inset: 15px;
    border: 6px double gold;
    border-radius: 20px;
    pointer-events: none;
}

/* Mandala */
.mandala {
    position: absolute;
    width: 60vw;
    max-width: 350px;
    opacity: 0.12;
    animation: rotateMandala 30s linear infinite;
}

@keyframes rotateMandala {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.greeting {
    font-family: 'Noto Serif Devanagari', serif;
    font-size: clamp(2rem, 6vw, 3.5rem);
    color: gold;
    text-shadow: 0 0 15px #fff, 0 0 35px #ffcc00;
    z-index: 2;
}

/* Decorative dots */
.decor {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    color: gold;
    font-size: 20px;
    letter-spacing: 10px;
}

/* Bangle Button */
.bangle-btn {
    width: 40vw;
    max-width: 170px;
    margin-top: 40px;
    cursor: pointer;
    transition: 0.4s ease;
    z-index: 2;
}

.bangle-btn:hover {
    transform: scale(1.1) rotate(10deg);
}

/* ---------------- PAGE 2 ---------------- */

#page2 {
    display: none;
    height: 100vh;
    background: black;
    position: relative;
    overflow: hidden;
}

.door {
    width: 100%;
    height: 100vh;
    object-fit: cover;
    transition: transform 2s ease;
    transform-origin: left;
}

/* Key */
.key-btn {
    position: absolute;
    bottom: 40px;
    right: 20px;
    width: 25vw;
    max-width: 120px;
    cursor: pointer;
    animation: float 2s infinite ease-in-out;
    filter: drop-shadow(0 0 10px gold);
}

@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

/* Falling petals */
.fall {
    position: absolute;
    font-size: 22px;
    animation: fall linear infinite;
}

@keyframes fall {
    0% { transform: translateY(-10vh); }
    100% { transform: translateY(110vh); }
}

/* Video */
video {
    display: none;
    width: 100%;
    height: 100vh;
    object-fit: cover;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="page1">
    <div class="border"></div>
    <div class="decor">✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦ ✦</div>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Mandala_pattern.svg/512px-Mandala_pattern.svg.png" class="mandala">
    <div class="greeting">खम्मा घणी आकृति 👑</div>
    <img src="bangle.jpg" class="bangle-btn" onclick="goToPage2()">
</div>

<!-- PAGE 2 -->
<div id="page2">
    <img src="gate.jpg" class="door" id="door">
    <img src="key.jpg" class="key-btn" onclick="openDoor()">

    <video id="loveVideo" playsinline controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
</div>

<script>

function goToPage2() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("page2").style.display = "block";
    createFall();
}

function openDoor() {

    const door = document.getElementById("door");
    const video = document.getElementById("loveVideo");

    // Open gate
    door.style.transform = "rotateY(90deg)";

    // Wait until gate finishes opening
    setTimeout(function() {

        door.style.display = "none";

        // Show and play video
        video.style.display = "block";

        video.play().catch(error => {
            console.log("Playback prevented:", error);
        });

    }, 2000);
}

function createFall() {
    for(let i=0; i<30; i++){
        let el = document.createElement("div");
        el.classList.add("fall");
        el.innerHTML = Math.random() > 0.5 ? "🌹" : "💛";
        el.style.left = Math.random() * 100 + "vw";
        el.style.animationDuration = (Math.random() * 4 + 3) + "s";
        document.getElementById("page2").appendChild(el);
    }
}

</script>

</body>
</html>
